# The v2 escrow coordinator. Secrets come from the environment, never from here.
#
# Required in the environment:
#   ZECP2P_LP_PRIV        the LP key, 64 hex. Half of every escrow this serves.
#   ZECP2P_ATTESTOR_TOKEN the attestor's bearer token.

[server]
# What this coordinator calls itself in an alert and in /health. Set it when you
# run more than one - a mainnet instance and a testnet one, or two hosts - so a
# message says which. Empty falls back to the network name.
instance_name = ""
host = "127.0.0.1"
port = 3000
state_dir = "~/.zecp2p/v2coordinator"
# The fill journal, which is also the payment slot.
#
# THIS MUST BE THE SAME FILE zecp2p-taker WRITES (taker.journal_path) on any
# machine where both run. There is one Venmo balance and one feed, and two
# identical payments in that feed cannot be told apart by the enclave's
# payment_index. Two daemons with two journals hold two slots, so each will pay
# while the other is paying - and it looks like it is working, because each
# process is internally consistent.
#
# Both daemons take an exclusive flock(2) on this file and make the decision
# and the claim in one locked step, so the read-then-act window between the two
# processes is closed rather than merely narrow. Each append is a single write
# syscall, so a concurrent writer cannot split a line either.
#
# The lock is advisory and cooperative: it binds these two programs because both
# take it. A third writer that does not take it is not stopped by it.
#
# A leading ~/ expands on both sides. An absolute path is still clearer.
journal_path = "/home/YOU/.zecp2p/fills.jsonl"
# Origins allowed to call the API from a browser. Empty means same-origin only,
# which is what a deployment serving the page itself wants.
allowed_origins = []

[zec]
rpc_url = "http://127.0.0.1:8232"
# rpc_user / rpc_password for a local zcashd or zebrad.
# rpc_api_key_header plus rpc_api_key_env for a hosted provider that keys on a
# header. Prefer rpc_api_key_env over the inline rpc_api_key: the deployed config
# is world-readable, and a key in it is readable by every local account.
network = "test"
refund_hours = 24
block_seconds = 75
# How the funding output is found. `block_scan` walks blocks and works on any
# node, including zebrad. `address_index` is one `getaddressutxos` call and
# needs zcashd with addressindex=1.
scanner = "block_scan"
scan_lookback_blocks = 200

# How long to keep retrying an unreachable node at startup before giving up.
#
# Exiting on the first failure turned a provider incident during a restart into
# a restart loop, and a coordinator that is not running does not offer anybody
# the refund they are owed. Every deadline this serves is tens of minutes wide,
# so waiting is strictly better. Zero restores the old fail-fast behaviour;
# `--check` never waits.
startup_retry_seconds = 600

# Further endpoints to fall back to, in order, when `rpc_url` does not answer.
#
# One provider is one incident away from a coordinator that cannot read a
# height, and the height is what decides when a user is offered their refund.
# Each entry is a whole endpoint with its own credentials, because providers do
# not share an auth scheme and running your own node beside a hosted one is the
# case this exists for. Order is your preference; `rpc_url` is always tried
# first.
#
# Only an unreachable node fails over. A node that answers "rejected" has
# answered, and asking another until one agrees is how a transaction gets
# broadcast twice.
#
# [[zec.fallback_rpc]]
# rpc_url = "http://127.0.0.1:8232"
# rpc_user = "zcashrpc"
# rpc_password = "set-in-the-environment-instead"
#
# [[zec.fallback_rpc]]
# rpc_url = "https://another-provider.example/zcash"
# rpc_api_key_header = "x-api-key"
# rpc_api_key_env = "ZECP2P_RPC_API_KEY_2"

[attestor]
url = "http://127.0.0.1:8480"
token = "set-ZECP2P_ATTESTOR_TOKEN-instead"
# Required on mainnet. This process relays the attestor's announcement to the
# page, so an unpinned key means the coordinator could name an attestor whose
# scalar it holds and decrypt the user's pre-signature without paying.
# pubkey = ""

[lp]
# Where the LP takes its leg of the release.
payout_address = "tmVHejhMFq979Z7oRwseWMW7snYoQsj22yn"
key_env = "ZECP2P_LP_PRIV"
# keystore_dir = "~/.zecp2p/keys"
key_label = "v2coordinator-lp"

[quote]
# The ZEC/USD rate comes from the market, not from this file. Coinbase is asked
# first and Kraken is the fallback; the answer is cached for 45 s, so the
# exchanges see about one call a minute however busy the coordinator is.
#
# A price that cannot be read, or that is outside the plausible range, or that
# has moved more than 50% from the last good one, means the coordinator
# REFUSES to quote. It never falls back to a stale or default rate: a wrong
# price on a service holding user funds costs more than an outage does.
#
# rate_usd_per_zec pins a fixed rate and switches the feed off. It is for a
# regtest or a rehearsal that must not depend on an exchange. Leave it out in
# any deployment that quotes real trades - a pinned rate is wrong the moment
# the market moves, and a pinned 40.25 against a $1,022 market quoted about
# $127 of ZEC for a $5 payout.
# rate_usd_per_zec = 40.25
#
# The spread over the market price, in basis points, and the LP's margin. It
# fronts dollars against a coin whose price moves while the escrow is open;
# before this the LP captured no spread at all. 50 = 0.5%.
spread_bps = 50
# How long to wait on a price feed before giving up on it.
price_timeout_seconds = 10
# 15 bps, the rate treasury.rs carries and the 0.15% the launch page states.
# Zero disables the treasury output. Left out entirely, this follows
# treasury::PLATFORM_FEE_BPS, which is the safer thing to do: a number written
# here does not move when that constant does.
fee_bps = 15
min_zat = 120000
max_zat = 5000000000
quote_seconds = 300
# The ceiling on one Venmo payment. The last line against a units/dollars
# confusion, and the operator's own limit on a single trade.
max_payment_cents = 2500
# Orders cannot be evicted: one this process forgets is an escrow whose release
# nobody can assemble. So the bound is applied when an order is opened.
max_open_orders = 200
max_open_per_handle = 5

[serve]
# Whose escrows this coordinator fronts fiat for. An empty list with
# allow_any_handle unset refuses every order: unlike the Base rail's
# `only_user`, silence here does not mean "serve everyone".
handles = []
allow_any_handle = false
# false drives the browser and stops at the irreversible step.
live_payments = false

[venmo]
cdp_url = "http://127.0.0.1:9222"
note = "thanks"
timeout_seconds = 120
session_path = "venmo-session.json"
session_max_age_hours = 12
# sender_id = ""   # the numeric Venmo id, not the @handle

[zkp2p]
# HTTPS is required except on loopback: anyone who can answer a plaintext
# request here returns any payee hash they like, and the dollars go to their
# handle.
api_url = "https://api.zkp2p.xyz"

[attestation]
service_url = "https://attestation-service.zkp2p.xyz"
# repo_root = "~/src/zecp2p"   # where scripts/proof/prove_payment_pinned.mjs lives

# ---------------------------------------------------------------------------
# Everything below is per-LP-instance operating policy. None of it changes what
# the escrow protocol does; all of it changes what this coordinator does when
# something is slow, missing, empty or broken.
# ---------------------------------------------------------------------------

[timeouts]
# Hard deadlines on the steps that can otherwise block for as long as they like.
#
# Before these, one wedged browser held the whole sweep - so no other order's
# funding was noticed, no deadline checked and no refund offered while it sat
# there. Each number bounds a call into something this process does not control.

# The watchdog on one whole `advance` for one order. Longer than the sum of the
# specific budgets below, deliberately: it catches a path with no bound of its
# own, and firing it means a bug rather than a slow trade.
order_advance_seconds = 900

# The fiat rail's `pay`. The one number here not to tighten casually:
# interrupting a payment mid-flight produces the ambiguous state a person has to
# resolve. Set longer than the rail's own internal waits so the rail's specific
# error wins the race and the operator gets a reason.
pay_seconds = 420

# Getting a payment attested, which includes the enclave. Safe to cut short:
# it is a read, no money moves either way, and the next sweep retries.
attest_seconds = 180

# One attempt at broadcasting a release. The escrow's own broadcast deadline
# still bounds the whole effort; this bounds one attempt so the sweep can move on.
broadcast_seconds = 120

# Any single node call.
node_call_seconds = 30

# How many orders the sweep advances at once. Unbounded fan-out over the
# open-order cap is what a hosted provider answers with a 429, whose backoff is
# minutes and is taken inside the sweep.
sweep_concurrency = 8

[limits]
# What a caller who has funded nothing can consume.
#
# Opening an order is free and used to hold capacity for a refund window. Five
# requests locked a handle out for a day; two hundred closed intake entirely.

# How long an order with no funding sighted holds a place. After this it stops
# counting against every intake guard. The record stays readable and still
# refunds, so a user who funded late is answered rather than 404'd.
unfunded_order_minutes = 45

# Open orders one client address may hold. The per-handle cap cannot be this
# bound: the handle is the payee, chosen by whoever opens the order. Zero
# disables.
max_open_per_client = 5

# Order-opening attempts per client per window, including refused ones - each
# still costs a quote, a curator call and a store scan. Zero disables.
open_rate_per_client = 10

# The backstop the per-client limit cannot see: many callers, or one caller
# behind many addresses. Zero disables.
open_rate_global = 120

rate_window_seconds = 60

# A header carrying the real client address, for a coordinator behind a proxy.
#
# Leave this unset unless your own relay actually rewrites the header. A caller
# can set any header they like, so trusting one nothing overwrites hands them
# the key they are limited on - which is worse than no limit, because it looks
# like one.
# client_ip_header = "x-forwarded-for"

[float]
# What the fiat rail must hold before this coordinator commits to a payment.
#
# Nothing here names a payment provider: the rail reports cents, and this is the
# policy applied to that number. Before it, running out presented as a payment
# that failed partway through rather than as a refusal at intake.

# Cents kept back beyond the payment itself. A reserve rather than a floor at
# zero, because the balance read is a snapshot and a payment authorised on a
# balance that exactly covers it can still fail.
reserve_cents = 0

# Alert when the balance falls below this, while trades are still being served,
# so you top up before the refusals start. Zero disables.
low_balance_cents = 0

# Whether to pay when the rail cannot report a balance. True by default: a rail
# with no balance concept is a perfectly good rail, and refusing would make this
# check a requirement on every future one. Set false if your rail can report and
# you want a failed read treated as an empty account.
pay_when_balance_unknown = true

balance_cache_seconds = 120

[alerts]
# How an operator hears that something is stuck.
#
# One hook, run as a subprocess with no shell, handed a JSON alert on stdin.
# Not a built-in client for any one messaging service: where an alert should go
# is yours to decide. The program and its arguments, not a command line - the
# body carries a handle a caller chose.
#
# The JSON is `{schema, instance, network, build, sent_at, key, severity,
# summary, action, detail}`. A hook that reads argv and ignores stdin is fine.
#
# notify_command = ["/home/YOU/.zecp2p/bin/notify.sh"]
notify_command = []

notify_timeout_seconds = 20

# The shortest gap between two alerts with the same key, so one stuck order is a
# message and a reminder rather than one per sweep.
repeat_minutes = 30

# How long the payment slot may be held before it is worth saying so.
slot_age_minutes = 20

# How long an order may sit paid-but-unreleased. The most expensive state on the
# board: the dollars have gone and the escrow has not released.
paid_age_minutes = 20

# How long since a sweep last finished. A sweep that has not completed leaves no
# log line at all, which is what a wedged browser looked like.
sweep_age_minutes = 10

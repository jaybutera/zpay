# zecp2p Configuration
# Public settings for the ZEC → Venmo offramp system

[network]
# Base mainnet RPC URL
base_rpc_url = "https://mainnet.base.org"
# Base Sepolia testnet RPC (for testing)
base_sepolia_rpc_url = "https://sepolia.base.org"
# Chain ID (8453 = Base mainnet, 84532 = Base Sepolia)
chain_id = 8453

[contracts]
# USDC on Base mainnet
usdc = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
# zk-p2p EscrowV2 on Base (deployments/base/EscrowV2.json in zkp2p/zkp2p-contracts)
zkp2p_escrow = "0x777777779d229cdF3110e9de47943791c26300Ef"
# zk-p2p OrchestratorV3 on Base (deployments/base/OrchestratorV3.json)
zkp2p_orchestrator = "0x014025fDE093f8701d86e9f38e2C3a9b779cb5c7"
# GlueContract address (set after deployment)
# glue_contract = "0x..."

[contracts.testnet]
# USDC on Base Sepolia (Circle official testnet USDC)
usdc = "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
# zk-p2p Escrow on Base Sepolia
zkp2p_escrow = "0x6a5e11c3D87e22b828d02ee65a4e8f322BF6B97E"
# zk-p2p Orchestrator on Base Sepolia
zkp2p_orchestrator = "0x7D563c65456deF11c1Fdb9510eB745D5a780F5Fd"

[near]
# NEAR Intents 1Click API
api_url = "https://1click.chaindefuser.com"
# Default timeout for NEAR settlement (seconds)
default_timeout = 600

[zkp2p]
# zk-p2p curator API. Venmo usernames are registered here and the returned
# hashedOnchainId is the payeeDetails used for the zk-p2p deposit.
api_url = "https://api.zkp2p.xyz"

[keeper]
# One offramp at a time. The glue holds every session's USDC in one pot and an
# ERC-20 transfer names no session, so a delivery is attributed off-chain from
# what 1Click reports settled. Refusing a second concurrent session means a
# mistake in that attribution has no second user's money to reach. Set true only
# as a deliberate choice to rely on the settled-amount rule alone.
allow_concurrent_sessions = false

[server]
# Coordinator server host
host = "127.0.0.1"
# Coordinator server port
port = 3000

[database]
# SQLite database path
path = "zecp2p.db"

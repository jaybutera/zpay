# zecp2p taker agent, Base mainnet.
# Copy to config.taker.toml and set glue_contract.
#
# Needs TAKER_PRIVATE_KEY in the environment: a Base key holding USDC for both
# the stake and the payments, plus ETH for gas.

[network]
base_rpc_url = "https://mainnet.base.org"
chain_id = 8453

[contracts]
usdc = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
zkp2p_escrow = "0x777777779d229cdF3110e9de47943791c26300Ef"        # EscrowV2
zkp2p_orchestrator = "0x014025fDE093f8701d86e9f38e2C3a9b779cb5c7"  # OrchestratorV3
stake_vault = "0x47c26258222e2f96424bD2B21bf173f0DA5034C7"        # locks taker stake
glue_contract = "0x0000000000000000000000000000000000000000"      # the OfframpGlue to serve

[taker]
# Where to look up the Venmo username behind a deposit. Omit it and pass
# --recipient instead.
#
# Must be https for anything but loopback: the username you are about to pay
# travels over this connection, and anyone on the path could rewrite it. The
# agent checks the answer against the deposit's own on-chain payeeDetails before
# paying either way, so a wrong name is refused rather than paid.
coordinator_url = "https://coordinator.example"
# The deposit listing serves Venmo usernames, so it is authenticated. Ask the
# coordinator operator for a token; COORDINATOR_TAKER_TOKEN overrides this.
# coordinator_token = "..."
# 6-decimal USDC units. 100000000 = 100 USDC.
max_intent_amount = "100000000"
min_intent_amount = "1000000"
poll_interval_seconds = 15
lookback_blocks = 5000
# Hard ceiling on any one Venmo payment, in whole cents. Refuses rather than
# clamps: this is what stops a units/dollars confusion or a bad conversion rate
# from reaching the send button. Raise it deliberately.
max_payment_cents = 2500
# Written before each irreversible step, so a restart can tell which fills may
# have moved money.
#
# It is also the payment slot, and the slot is global: one Venmo balance, and
# two identical payments in the feed that the enclave's payment_index cannot
# tell apart. So if zecp2p-v2coordinator runs against the same Venmo account,
# BOTH must name this same file - it sets server.journal_path for exactly this
# reason. Two journals mean two slots, and each daemon will pay while the other
# is paying.
#
# Both daemons now read this file before every fill, not just at startup, and
# both write their claim before the click. There is no file lock, so two
# processes reading at the very same instant can still both see it free; the
# windows are small and getting smaller, but this is not a mutex. Do not run
# two payers against one account and rely on it alone.
#
# A leading ~/ expands on both sides.
journal_path = "/home/YOU/.zecp2p/fills.jsonl"

[session]
# Venmo session material the enclave replays: the account.venmo.com Cookie
# header and the numeric sender id. Written 0600; treat it as a password file.
# One capture serves many fills, so this is a refresh problem rather than a
# per-fill one. `zecp2p-taker refresh-cookie` re-captures it.
# Either JSON with the cookie, sender id and capture time, or a bare Cookie
# header as copied out of devtools. The bare form needs sender_id below and
# takes its capture time from the file's mtime.
path = "venmo-session.json"
# Refuse to signal on material older than this. The attestation service imposes
# no such limit; this is caution. Checked before signalIntent, because a dead
# cookie found after the payment means the fiat is gone.
max_age_hours = 12
# The NUMERIC Venmo account id whose feed the enclave reads. Not the @handle.
# Required when path holds a bare Cookie header.
# sender_id = "1234567890"
# The User-Agent the cookie was captured under. Venmo ties a session to it
# closely enough that a mismatched agent can fail the enclave's replay.
# user_agent = "Mozilla/5.0 ...

[venmo]
# Chrome started with --remote-debugging-port=9222, already logged into Venmo.
cdp_url = "http://127.0.0.1:9222"
note = "thanks"
timeout_seconds = 120
# Where the Venmo sign-in credentials live, for unattended re-login. Not this
# file: this one is committed and carries no secrets, that one holds a live
# password and is gitignored. Copy config/venmo.example.toml to it and fill it
# in, then run `zecp2p-taker venmo-health` to see whether an expiry could be
# repaired without a human.
#
# If the file is absent the daemon behaves exactly as it did before: the health
# check still runs and still reports a dead session, it just cannot fix one.
credentials_path = "config/venmo.local.toml"

[zkp2p]
# The curator that issues payeeDetails hashes. The agent asks it what the
# coordinator's username hashes to, and refuses to pay unless that matches the
# hash the deposit itself carries.
api_url = "https://api.zkp2p.xyz"
# POST /v3/sign requires thirteen fields and names none of them in its errors.
# Twelve are sent by the gating client; if a live call reports one still
# missing, add it here rather than waiting for a release.
# [zkp2p.gating_extra]
# someField = "value"

# The native Zcash escrow rail, which runs alongside the Base one rather than
# replacing it. Commented out, and absence means off: a daemon that switched on
# a second settlement system because a section was missing would start watching
# a chain nobody configured. `zecp2p-taker rails` says which rails are live.
#
# [zec]
# Zcash RPC. Depth, consensus branch id and the escrow output are all read
# through this, and the LP pays real fiat on the strength of what it says, so
# https is required for anything that is not loopback.
# rpc_url = "https://api.tatum.io/v3/blockchain/node/zcash-mainnet"
# Basic auth, as a local zcashd wants. A hosted endpoint keying on a header
# uses rpc_api_key_header and rpc_api_key instead.
# rpc_user = "..."
# rpc_password = "..."
# rpc_api_key_header = "x-api-key"
# rpc_api_key = "..."
# "main" or "test". Not defaulted: a rail that defaulted to the chain with real
# coin on it would be one typo from spending it.
# network = "main"
# The attestor that publishes the outcome scalar.
# attestor_url = "http://127.0.0.1:8480"
# The attestor's public key, pinned. A mainnet rail without this is refused at
# load: a pre-signature encrypted under an unpinned attestor's outcome point can
# be decrypted by whoever holds that key.
# attestor_pubkey = "02..."
# Refund delay in hours, and the block time used to turn it into heights. Both
# are wall-clock quantities so a block-time change keeps the same real timeout;
# NU7 proposes 25 s, at which the same 24 hours is three times the blocks.
# refund_hours = 24
# block_seconds = 75
# Where the escrow crate's run records live. Each escrow's pre-signature is read
# back from here rather than regenerated; regenerating draws a fresh nonce and
# the record would then disagree with the mined release.
# state_dir = "~/.zecp2p"

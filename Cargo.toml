[workspace]
resolver = "2"
members = [
    "crates/zecp2p-types",
    "crates/zecp2p-taker",
    "crates/zecp2p-escrow",
    "crates/zecp2p-attestor",
    "crates/zecp2p-v2coordinator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["jay"]

[workspace.dependencies]
# Shared types
zecp2p-types = { path = "crates/zecp2p-types" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "propagate-header"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Ethereum/Base
alloy = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
hex = "0.4"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# TOTP (RFC 6238) for the taker's unattended Venmo re-login. HMAC-SHA1 and a
# base32 decoder are the whole of it, so the algorithm is implemented in
# `auto::login` against the RFC's own vectors rather than pulled from a crate.
hmac = "0.12"
sha1 = "0.10"

# Testing
tempfile = "3"
rand = "0.8"

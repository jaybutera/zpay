# zecp2p Configuration (Base Sepolia Testnet)
# Use this for testing and development

[network]
# Base Sepolia testnet RPC
base_rpc_url = "https://sepolia.base.org"
base_sepolia_rpc_url = "https://sepolia.base.org"
# Base Sepolia chain ID
chain_id = 84532

[contracts]
# USDC on Base Sepolia (Circle official testnet USDC; faucet at faucet.circle.com)
usdc = "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
# zk-p2p has no EscrowV2-compatible deployment on Base Sepolia. The two known
# testnet escrows (0x6a5e11c3D87e22b828d02ee65a4e8f322BF6B97E and
# 0x15EF83EBB422B4AC8e3b8393d016Ed076dc50CB7) expose createDeposit signatures
# that differ from production, so the glue cannot deposit into them.
# scripts/testnet/01_deploy_sepolia.sh deploys a stand-in escrow
# (MockEscrowWithOrchestrator) that also emits the orchestrator events; put its
# address in both fields below. The real EscrowV2 encoding is exercised by
# scripts/dryrun/fork_base.sh on a mainnet fork.
zkp2p_escrow = "0x88501C514b4226A45C108aC9C443cBaA635430eE"
zkp2p_orchestrator = "0x88501C514b4226A45C108aC9C443cBaA635430eE"
# GlueContract address (deployed 2026-08-30 by 01_deploy_sepolia.sh --broadcast)
glue_contract = "0x78329E4195d0cED3E06b19F9DA800160bcF74511"

[near]
# NEAR Intents 1Click API (same for mainnet and testnet)
api_url = "https://1click.chaindefuser.com"
# Default timeout for NEAR settlement (seconds)
default_timeout = 600

[zkp2p]
# zk-p2p curator API. Venmo usernames are registered here and the returned
# hashedOnchainId is the payeeDetails used for the zk-p2p deposit.
api_url = "https://api.zkp2p.xyz"

[keeper]
# One offramp at a time. The glue holds every session's USDC in one pot and an
# ERC-20 transfer names no session, so a delivery is attributed off-chain from
# what 1Click reports settled. Refusing a second concurrent session means a
# mistake in that attribution has no second user's money to reach. Set true only
# as a deliberate choice to rely on the settled-amount rule alone.
allow_concurrent_sessions = false

[server]
# Coordinator server host
host = "127.0.0.1"
# Coordinator server port
port = 3000

[database]
# SQLite database path (separate from mainnet)
path = "zecp2p_testnet.db"

[package]
name = "zecp2p-coordinator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Coordinator REST API for zecp2p offramp"

[dependencies]
zecp2p-types = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sqlx = { workspace = true }
alloy = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
dotenvy = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# The session key's derivations. k256 is already in the tree under alloy; naming
# it here is what lets this crate derive an address from a public key the page
# sends, without ever holding the secret.
k256 = "0.13"
ripemd = "0.1"
sha2 = "0.10"
async-trait = "0.1"
# Unified address decoding, so a refund can go to the address a Zcash user
# actually has. The escrow crate already depends on these.
zcash_address = "0.13"
zcash_protocol = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
rand = "0.8"

[[bin]]
name = "zecp2p-coordinator"
path = "src/main.rs"

[lib]
name = "zecp2p_coordinator"
path = "src/lib.rs"

[package]
name = "zecp2p-taker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Taker agent: discovers open zk-p2p deposits, signals intents, pays via Venmo"

[features]
# Exposes `Journal::append_unchecked`, which writes a journal line without the
# payment-slot gate. Test fixtures and recovery tooling only: a daemon that
# could call it could open a fill with the gate skipped, which is how one
# escrow gets paid twice. Enabled from dev-dependencies, never from a binary.
journal-fixtures = []

[dependencies]
zecp2p-types = { workspace = true }
zecp2p-escrow = { path = "../zecp2p-escrow" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
alloy = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
dotenvy = { workspace = true }
chrono = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
# flock(2) around the fill journal, which is the cross-daemon payment slot.
libc = "0.2"
tokio-tungstenite = "0.26"
futures-util = "0.3"

[dev-dependencies]
zecp2p-taker = { path = ".", features = ["journal-fixtures"] }
tempfile = { workspace = true }
secp256k1-zkp = { version = "0.11", features = ["rand", "rand-std", "std", "hashes", "global-context"] }
filetime = "0.2"
axum = { workspace = true }

[[bin]]
name = "zecp2p-taker"
path = "src/main.rs"

[lib]
name = "zecp2p_taker"
path = "src/lib.rs"

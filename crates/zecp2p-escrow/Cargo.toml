[package]
name = "zecp2p-escrow"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Exposes verify_against_signer, which trusts a caller-supplied enclave key.
# Tests need it to bind attestations to terms they control; production builds
# must not have that path at all.
test-signer = []
# Exposes RatePolicy::AtLeast and ::Unenforced. Round 2 settled that a ZEC
# escrow must use Exact(1e18); anything looser resurrects the round-1 exploit,
# so a production build cannot construct one.
loose-rate-policy = []

[dependencies]
zcash_primitives = { version = "0.30", features = ["transparent-inputs", "circuits"] }
zcash_protocol = { version = "0.10", features = ["local-consensus"] }
zcash_transparent = { version = "0.10", features = ["transparent-inputs"] }
zcash_address = "0.13"
zcash_encoding = "0.5"
orchard = "0.15"
sapling = { package = "sapling-crypto", version = "0.7" }
zcash_script = "0.4"
secp256k1 = { version = "0.30", features = ["rand", "recovery", "global-context", "hashes"] }
secp256k1-zkp = { version = "0.11", features = ["rand", "rand-std", "std", "hashes", "global-context"] }
ripemd = "0.1"
sha3 = "0.10"
sha2 = "0.10"
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

[dev-dependencies]
tempfile = { workspace = true }
hex-literal = "0.4"
zcash_script = { version = "0.4", features = ["signature-validation", "test-dependencies"] }
sha3 = "0.10"
jubjub = "0.10"
bls12_381 = "0.8"
